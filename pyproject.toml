[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agentflight-mcp"
version = "1.4.0"
description = "AI Agent Black-Box Flight Recorder, Deterministic Trajectory Replay, Loop/Cost Circuit Breaker & MCP Tool-Smell Linter"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    {name = "Akandwanaho Ivan Alvin", email = "codesphere.u@github.com"}
]
keywords = [
    "ai-agents",
    "mcp",
    "model-context-protocol",
    "agent-evaluation",
    "llm-testing",
    "flight-recorder",
    "circuit-breaker",
    "developer-tools",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Testing",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "fastapi>=0.162.2",
    "pydantic>=2.14.3",
    "uvicorn>=0.54.0",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27.0",
    "mypy>=1.11.0",
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.8.0",
]

[project.scripts]
agentflight = "agentflight.cli:main"

[project.entry-points."pytest11"]
agentflight = "_agentflight_pytest"

[project.urls]
Homepage = "https://github.com/codesphere-u/agentflight"
Repository = "https://github.com/codesphere-u/agentflight"
Playground = "https://agentflight-tau.vercel.app"
Creator = "https://alvin.codesphereug.com/"
Issues = "https://github.com/codesphere-u/agentflight/issues"

[tool.setuptools]
package-dir = {"" = "src"}
py-modules = ["_agentflight_pytest"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.vercel]
entrypoint = "api.index:app"

[tool.ruff]
target-version = "py310"
line-length = 120
src = ["src", "tests", "api"]

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"api/*.py" = ["E402"]
"tests/test_api_portal.py" = ["E402"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
explicit_package_bases = true
files = ["src/agentflight", "api"]

[tool.coverage.run]
source = ["src/agentflight"]
omit = ["src/agentflight/_version.py"]

[tool.coverage.report]
show_missing = true
fail_under = 90

