[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agentflight"
version = "1.1.0"
description = "AI Agent Black-Box Flight Recorder, Deterministic Trajectory Replay, Loop/Cost Circuit Breaker & MCP Tool-Smell Linter"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "Akandwanaho Ivan Alvin", email = "codesphere.u@github.com"}
]
keywords = [
    "ai-agents",
    "mcp",
    "model-context-protocol",
    "agent-evaluation",
    "llm-testing",
    "flight-recorder",
    "circuit-breaker",
    "developer-tools",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Testing",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "fastapi>=0.162.2",
    "pydantic>=2.14.3",
    "uvicorn>=0.54.0",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27.0",
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
]

[project.scripts]
agentflight = "agentflight.cli:main"

[project.urls]
Homepage = "https://github.com/codesphere-u/agentflight"
Repository = "https://github.com/codesphere-u/agentflight"
Issues = "https://github.com/codesphere-u/agentflight/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.vercel]
entrypoint = "api.index:app"

