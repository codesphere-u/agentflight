name: AgentFlight CI & Reliability Gate

on:
  push:
    branches: ["main"]
    tags: ["v*"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  test-and-benchmark:
    name: Pytest + MCP Linter + Replay Benchmark (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run 90-test pytest suite with coverage
        run: |
          pytest -v --cov=agentflight --cov-report=term-missing

      - name: Execute CLI showcase & MCP tool-smell linter gate
        run: |
          agentflight lint
          agentflight demo

      - name: Execute reproducible benchmark gate
        run: |
          agentflight benchmark
